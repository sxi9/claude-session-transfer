name: Context Bank Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - "context-bank/**"
      - ".github/workflows/context-bank-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: context-bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Portable single exe + zip
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ContextBank-windows
          path: |
            context-bank/dist/builder/*.exe
            context-bank/dist/ContextBank-win64.zip
          if-no-files-found: error
